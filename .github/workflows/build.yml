name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libfreetype6 libice6 libsm6 libx11-6 libxrandr2 libxi6 libxcursor1 libglib2.0-0
      - name: Native Spout2 build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-native.ps1
      - run: dotnet test ContentWatch.slnx -c Release --logger trx
      - name: Publish portable application
        run: dotnet publish src/ContentWatch.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/ContentWatch-${{ matrix.rid }}
      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md artifacts/ContentWatch-${{ matrix.rid }}/
          Copy-Item -Recurse docs artifacts/ContentWatch-${{ matrix.rid }}/
          if (Test-Path artifacts/native/Spout2-LICENSE.txt) { Copy-Item artifacts/native/Spout2-LICENSE.txt artifacts/ContentWatch-${{ matrix.rid }}/ }
      - uses: actions/upload-artifact@v4
        with:
          name: ContentWatch-${{ matrix.rid }}
          path: artifacts/ContentWatch-${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: '**/TestResults/*.trx'
