<!doctype html>
<html><head><meta charset="utf-8"><title>ContentWatch overlay</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}canvas{width:100%;height:100%;object-fit:contain}</style></head>
<body><canvas width="1280" height="360"></canvas><script>
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
let generation=0;
function connect(){
  const own=++generation, ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/frames`);
  ws.binaryType='blob';
  ws.onmessage=async event=>{
    // Server waits for an acknowledgement, preventing decode queues and old frames.
    try {const bitmap=await createImageBitmap(event.data);
      if(own===generation){ctx.clearRect(0,0,1280,360);ctx.drawImage(bitmap,0,0);}
      bitmap.close(); if(ws.readyState===1)ws.send('next');
    } catch {ws.close();}
  };
  ws.onclose=()=>setTimeout(connect,500);
  ws.onerror=()=>ws.close();
}
connect();
</script></body></html>
